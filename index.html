<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandProud</title>
</head>

<style>

    div{border: 1px solid black;}
    header{height: 80px;
        background-color: rgb(252, 231, 138);
        display: flex;}
    #title{text-align: center;
        align-items: center;
        justify-content: center;
        flex:2;}
    #profile{display: flex;
        justify-content: flex-start;
        flex:1;}
    #profile img{height: 100%;
        width: 100%;}
    #profileicon{height: 80px;
        width: 80px;}
    #settings{display: flex;
        justify-content: flex-end;
        flex:1;}
    #settings img{height: 100%;
        width: 100%;}
    #settingsicon{height: 80px;
        width: 80px;}
    #container{height: 90vh;
        background-color: rgb(255, 147, 147);}

</style>

<body>
    <header>
        <div id="profile">
            <div id="profileicon">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png">
            </div>
        </div>
        <div id="title">
            <h1>Stand Proud</h1>
        </div>
        <div id="settings">
            <div id="settingsicon">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6d/Windows_Settings_app_icon.png">
            </div>
        </div>
    </header>
    <div id="container">

    </div>
</body>
</html>
